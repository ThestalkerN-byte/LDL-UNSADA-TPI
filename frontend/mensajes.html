<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICB - Mensajes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>

<body style="background-color: #F8F9FA;">

    <!-- Overlay -->
    <div class="menu-overlay" id="menuOverlay"></div>

    <!-- Menú lateral -->
    <nav class="side-menu" id="sideMenu">
        <button class="side-menu-close" id="btnCloseMenu">✕</button>
        <div class="side-menu-header">
            <div class="side-menu-avatar">
                <svg viewBox="0 0 24 24"><path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z" fill="rgba(255,255,255,0.85)"/></svg>
            </div>
            <div class="side-menu-info">
                <div class="name">Cristhian Petrecca</div>
                <div class="role">Administrador</div>
            </div>
        </div>
        <div class="side-menu-nav">
            <a href="admin-usuarios.html" class="menu-item">Credenciales</a>
            <a href="mensajes.html"       class="menu-item active">Mensajes</a>
            <a href="sellos.html"         class="menu-item">Editar Sellos</a>
        </div>
        <div class="side-menu-footer">
            <button class="menu-item menu-item-danger" onclick="location.href='login.html'">Cerrar Sesión</button>
        </div>
    </nav>

    <!-- Navbar -->
    <nav class="navbar navbar-icb px-3 py-3 shadow-sm">
        <div class="container-fluid max-w-custom d-flex justify-content-between align-items-center">
            
            <div class="d-flex align-items-center gap-3">
                <!-- Hamburguesa -->
                <button class="btn-hamburger" id="btnOpenMenu" aria-label="Abrir menú">
                    <span></span><span></span><span></span>
                </button>

                <!-- Campana -->
                <div class="navbar-bell-wrapper">
                    <i class="bi bi-bell-fill text-warning" id="btnBell" style="font-size: 1.5rem; cursor: pointer;"></i>
                    <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" 
                        id="bellBadge"
                        style="font-size: 0.6rem; transform: translate(-30%, 10%) !important;">
                        3
                    </span>
                    <!-- Dropdown -->
                    <div class="alerts-dropdown" id="alertsDropdown">
                        <div class="alerts-header">Próximas a vencer</div>
                        <div class="alerts-list" id="alertsList"></div>
                    </div>
                </div>
            </div>

            <img src="images/logo.png" alt="ICB" class="header-logo" onerror="this.outerHTML='<span style=\'color:white; font-weight:bold; font-size:24px;\'>I&B</span>'">

        </div>
    </nav>

    <!-- Contenido -->
    <div class="container px-3 mt-4 max-w-custom">

        <h2 class="fw-bold text-center mb-4" style="color: #0B2A4A;">MENSAJES</h2>

        <div id="mensajesList"></div>

    </div>

    <script>
        const mensajes = [
            {
                id: 1,
                nombre: 'Lautaro Vienny',
                dni: '41.689.013',
                hora: 'Hoy, 19:30 hs',
                texto: 'Hola, acabo de cambiar mi número de celular. Podrían actualizarlo en mi perfil al 03329-123456? Gracias.'
            },
            {
                id: 2,
                nombre: 'Rocio Cappuccio',
                dni: '25.129.073',
                hora: 'Jueves 14, 14:21 hs',
                texto: 'Hola, acabo de cambiar mi domicilio. Podrían actualizarlo en mi perfil a Anchorena 2311? Gracias.'
            }
        ];

        function renderizarMensajes() {
            const container = document.getElementById('mensajesList');
            container.innerHTML = '';

            mensajes.forEach(msg => {
                const card = document.createElement('div');
                card.className = 'card bg-white shadow-sm mb-3 rounded-3';
                card.style.border = '1.5px solid #DEE2E6';
                card.innerHTML = `
                    <div class="card-body p-3">

                        <div class="d-flex justify-content-between align-items-start mb-1">
                            <div>
                                <h6 class="fw-bold mb-0" style="color: #0B2A4A;">${msg.nombre}</h6>
                                <small class="text-muted">DNI: ${msg.dni}</small>
                            </div>
                            <small class="text-muted">${msg.hora}</small>
                        </div>

                        <div class="rounded-3 px-3 py-2 mt-2 mb-3"
                             style="background-color: #D9EAFF; font-size: 0.9rem; color: #1e293b;">
                            "${msg.texto}"
                        </div>

                        <textarea class="form-control rounded-3 mb-2"
                                  rows="2"
                                  placeholder="Escribe tu respuesta..."
                                  style="font-size: 0.9rem; border-color: #DEE2E6; resize: none;"
                                  id="respuesta-${msg.id}"></textarea>

                        <div class="d-flex justify-content-end">
                            <button class="btn rounded-pill px-4 fw-bold"
                                    style="background-color: #0B2A4A; color: white; font-size: 0.85rem;"
                                    onclick="enviarRespuesta(${msg.id})">
                                Enviar Respuesta
                            </button>
                        </div>

                    </div>
                `;
                container.appendChild(card);
            });
        }

        function enviarRespuesta(id) {
            const textarea = document.getElementById(`respuesta-${id}`);
            if (textarea.value.trim() === '') {
                alert('Escribí una respuesta antes de enviar.');
                return;
            }
            alert('Respuesta enviada correctamente.');
            textarea.value = '';
        }

        renderizarMensajes();
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const btnOpen  = document.getElementById('btnOpenMenu');
        const btnClose = document.getElementById('btnCloseMenu');
        const overlay  = document.getElementById('menuOverlay');
        const sideMenu = document.getElementById('sideMenu');

        btnOpen.addEventListener('click', () => {
            sideMenu.classList.add('active');
            overlay.classList.add('active');
        });

        function cerrarMenu() {
            sideMenu.classList.remove('active');
            overlay.classList.remove('active');
        }

        btnClose.addEventListener('click', cerrarMenu);
        overlay.addEventListener('click', cerrarMenu);
    </script>

    <script>
        // ── CAMPANA ──
        const alertasData = [
            { nombre: 'Rocio Cappuccio', dni: '41.689.013', fecha: '19/06/2026', dias: 30 },
            { nombre: 'Lautaro Vienny',  dni: '42.896.710', fecha: '11/06/2026', dias: 22 },
            { nombre: 'Ramiro Zabala',   dni: '41.135.791', fecha: '29/05/2026', dias: 9  },
        ];

        function colorDias(dias) {
            if (dias <= 10) return 'days-red';
            if (dias <= 20) return 'days-orange';
            return 'days-green';
        }

        function renderizarAlertas() {
            const lista = document.getElementById('alertsList');
            lista.innerHTML = '';
            alertasData.forEach(a => {
                const div = document.createElement('div');
                div.className = 'alert-card';
                div.innerHTML = `
                    <div class="alert-card-name">${a.nombre}</div>
                    <div class="alert-card-dni">DNI: ${a.dni}</div>
                    <div class="alert-card-footer">
                        <span style="font-size:12px; color:#475569;">Vence el ${a.fecha}</span>
                        <span class="days-badge ${colorDias(a.dias)}">${a.dias} días</span>
                    </div>
                    <div style="display:flex; justify-content:flex-end; margin-top:8px;">
                        <button class="btn-renovar-sm">Renovar</button>
                    </div>
                `;
                lista.appendChild(div);
            });
            document.getElementById('bellBadge').textContent = alertasData.length;
        }

        const btnBell      = document.getElementById('btnBell');
        const alertsDrop   = document.getElementById('alertsDropdown');

        btnBell.addEventListener('click', (e) => {
            e.stopPropagation();
            alertsDrop.classList.toggle('active');
            cerrarMenu();
        });

        document.addEventListener('click', (e) => {
            if (!alertsDrop.contains(e.target) && e.target !== btnBell) {
                alertsDrop.classList.remove('active');
            }
        });

        renderizarAlertas();
    </script>

</body>
</html>
