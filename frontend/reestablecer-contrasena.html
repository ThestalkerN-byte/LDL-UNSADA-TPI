<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICB - Restablecer Contraseña</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Roboto:wght@300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container vh-100 d-flex justify-content-center align-items-center">
        <div class="login-card shadow-sm">
            <img src="images/logo.png" alt="Logo ICB" class="logo-icb" onerror="this.src='https://via.placeholder.com/180x60/FFFFFF/0B2A4A?text=ICB+DIGITAL'">
            <p class="subtitle">IGLESIA CRISTIANA BÍBLICA</p>
            <h2 class="main-title" style="font-size: 2rem;">Restablecer contraseña</h2>
            
            <!-- Mensaje de estado (oculto por defecto) -->
            <div id="mensajeEstado" class="alert text-center" style="display: none;" role="alert"></div>

            <!-- Paso 1: Solicitar código -->
            <form id="formRecuperacion">
                <div class="mb-4">
                    <label for="identificador" class="form-label">Usuario, DNI o Correo Electrónico</label>
                    <input type="text" class="form-control" id="identificador" placeholder="Ingresa tu usuario, DNI o email" required>
                </div>
                 <div class="d-grid gap-2 col-8 mx-auto">
                    <button class="btn btn-primary" type="submit" id="btnEnviar" style="background-color: #0B2A4A; border: none; border-radius: 25px;">
                        <span id="btnTexto">Enviar Código</span>
                        <span id="btnSpinner" class="spinner-border spinner-border-sm" style="display: none;" role="status" aria-hidden="true"></span>
                    </button>
                </div>
                <div class="mt-4 text-center">
                    <a href="login.html" class="text-decoration-none small" style="color: #0B2A4A; font-weight: bold;">Volver a inicio de sesión</a>
                </div>
            </form>

            <!-- Paso 2: Ingresar código y nueva contraseña (oculto por defecto) -->
            <form id="formResetPassword" style="display: none;">
                <div class="mb-3">
                    <label for="codigo" class="form-label">Código de recuperación</label>
                    <input type="text" class="form-control" id="codigo" placeholder="Ingresa el código de 4 dígitos" required maxlength="4">
                </div>
                <div class="mb-3">
                    <label for="nuevaPassword" class="form-label">Nueva Contraseña</label>
                    <input type="password" class="form-control" id="nuevaPassword" placeholder="Mínimo 6 caracteres" required minlength="6">
                </div>
                <div class="mb-4">
                    <label for="confirmarPassword" class="form-label">Confirmar Contraseña</label>
                    <input type="password" class="form-control" id="confirmarPassword" placeholder="Repite tu contraseña" required minlength="6">
                </div>
                 <div class="d-grid gap-2 col-8 mx-auto">
                    <button class="btn btn-primary" type="submit" id="btnReset" style="background-color: #0B2A4A; border: none; border-radius: 25px;">
                        <span id="btnResetTexto">Restablecer</span>
                        <span id="btnResetSpinner" class="spinner-border spinner-border-sm" style="display: none;" role="status" aria-hidden="true"></span>
                    </button>
                </div>
                <div class="mt-4 text-center">
                    <a href="login.html" class="text-decoration-none small" style="color: #0B2A4A; font-weight: bold;">Volver a inicio de sesión</a>
                </div>
            </form>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        // Paso 1: Solicitar código
        document.getElementById('formRecuperacion').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const identificador = document.getElementById('identificador').value.trim();
            const mensajeEstado = document.getElementById('mensajeEstado');
            const btnTexto = document.getElementById('btnTexto');
            const btnSpinner = document.getElementById('btnSpinner');
            const btnEnviar = document.getElementById('btnEnviar');
            
            if (!identificador) {
                mostrarMensaje('Por favor, ingresa tu usuario, DNI o correo electrónico', 'warning');
                return;
            }
            
            btnEnviar.disabled = true;
            btnTexto.textContent = 'Enviando...';
            btnSpinner.style.display = 'inline-block';
            mensajeEstado.style.display = 'none';
            
            try {
                const response = await fetch('../index.php?action=recover_request', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ identificador: identificador })
                });
                const result = await response.json();
                
                if (result.status === 'success') {
                    const emailMostrado = result.data.email || 'tu correo registrado';
                    mostrarMensaje(`✅ Código enviado a ${emailMostrado}. Revisá tu bandeja de entrada (y la carpeta de spam).`, 'success');
                    
                    // Mostrar paso 2
                    document.getElementById('formRecuperacion').style.display = 'none';
                    document.getElementById('formResetPassword').style.display = 'block';
                } else {
                    mostrarMensaje(`❌ Error: ${result.message}`, 'danger');
                }
            } catch (error) {
                console.error('Error al solicitar código:', error);
                mostrarMensaje('❌ Error al enviar código. Por favor intente nuevamente.', 'danger');
            }
            
            btnEnviar.disabled = false;
            btnTexto.textContent = 'Enviar Código';
            btnSpinner.style.display = 'none';
        });

        // Paso 2: Restablecer contraseña
        document.getElementById('formResetPassword').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const codigo = document.getElementById('codigo').value.trim();
            const nuevaPassword = document.getElementById('nuevaPassword').value;
            const confirmarPassword = document.getElementById('confirmarPassword').value;
            const mensajeEstado = document.getElementById('mensajeEstado');
            const btnResetTexto = document.getElementById('btnResetTexto');
            const btnResetSpinner = document.getElementById('btnResetSpinner');
            const btnReset = document.getElementById('btnReset');
            
            if (!codigo || !nuevaPassword || !confirmarPassword) {
                mostrarMensaje('Por favor, completa todos los campos', 'warning');
                return;
            }
            
            if (nuevaPassword !== confirmarPassword) {
                mostrarMensaje('Las contraseñas no coinciden', 'warning');
                return;
            }
            
            if (nuevaPassword.length < 6) {
                mostrarMensaje('La contraseña debe tener al menos 6 caracteres', 'warning');
                return;
            }
            
            btnReset.disabled = true;
            btnResetTexto.textContent = 'Restableciendo...';
            btnResetSpinner.style.display = 'inline-block';
            mensajeEstado.style.display = 'none';
            
            try {
                const response = await fetch('../index.php?action=recover_reset', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        codigo: codigo,
                        password: nuevaPassword
                    })
                });
                const result = await response.json();
                
                if (result.status === 'success') {
                    mostrarMensaje('✅ Contraseña restablecida exitosamente. Redirigiendo al login...', 'success');
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2000);
                } else {
                    mostrarMensaje(`❌ Error: ${result.message}`, 'danger');
                }
            } catch (error) {
                console.error('Error al restablecer contraseña:', error);
                mostrarMensaje('❌ Error al restablecer contraseña. Por favor intente nuevamente.', 'danger');
            }
            
            btnReset.disabled = false;
            btnResetTexto.textContent = 'Restablecer';
            btnResetSpinner.style.display = 'none';
        });
        
        function mostrarMensaje(texto, tipo) {
            const mensajeEstado = document.getElementById('mensajeEstado');
            mensajeEstado.textContent = texto;
            mensajeEstado.className = 'alert text-center';
            
            switch(tipo) {
                case 'success':
                    mensajeEstado.classList.add('alert-success');
                    break;
                case 'warning':
                    mensajeEstado.classList.add('alert-warning');
                    break;
                case 'danger':
                    mensajeEstado.classList.add('alert-danger');
                    break;
                default:
                    mensajeEstado.classList.add('alert-info');
            }
            
            mensajeEstado.style.display = 'block';
        }
    </script>
</body>
</html>
