<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICB - Sellos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>

<body style="background-color: #F8F9FA;">

    <!-- Overlay -->
    <div class="menu-overlay" id="menuOverlay"></div>

    <!-- Menú lateral -->
    <nav class="side-menu" id="sideMenu">
        <button class="side-menu-close" id="btnCloseMenu">✕</button>
        <div class="side-menu-header">
            <div class="side-menu-avatar">
                <svg viewBox="0 0 24 24"><path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z" fill="rgba(255,255,255,0.85)"/></svg>
            </div>
            <div class="side-menu-info">
                <div class="name">Cristhian Petrecca</div>
                <div class="role">Administrador</div>
            </div>
        </div>
        <div class="side-menu-nav">
            <a href="admin-usuarios.html" class="menu-item">Credenciales</a>
            <a href="mensajes.html"       class="menu-item">Mensajes</a>
            <a href="sellos.html"         class="menu-item active">Editar Sellos</a>
        </div>
        <div class="side-menu-footer">
            <button class="menu-item menu-item-danger" onclick="location.href='login.html'">Cerrar Sesión</button>
        </div>
    </nav>

    <!-- Navbar -->
    <nav class="navbar navbar-icb px-3 py-3 shadow-sm">
        <div class="container-fluid max-w-custom d-flex justify-content-between align-items-center">
            
            <div class="d-flex align-items-center gap-3">
                <!-- Hamburguesa -->
                <button class="btn-hamburger" id="btnOpenMenu" aria-label="Abrir menú">
                    <span></span><span></span><span></span>
                </button>

                <!-- Campana -->
                <div class="navbar-bell-wrapper">
                    <i class="bi bi-bell-fill text-warning" id="btnBell" style="font-size: 1.5rem; cursor: pointer;"></i>
                    <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" 
                        id="bellBadge"
                        style="font-size: 0.6rem; transform: translate(-30%, 10%) !important;">
                        3
                    </span>
                    <!-- Dropdown -->
                    <div class="alerts-dropdown" id="alertsDropdown">
                        <div class="alerts-header">Próximas a vencer</div>
                        <div class="alerts-list" id="alertsList"></div>
                    </div>
                </div>
            </div>

            <img src="images/logo.png" alt="ICB" class="header-logo" onerror="this.outerHTML='<span style=\'color:white; font-weight:bold; font-size:24px;\'>I&B</span>'">

        </div>
    </nav>

    <!-- Contenido -->
    <div class="container px-3 mt-4 max-w-custom">

        <h2 class="fw-bold text-center mb-4" style="color: #0B2A4A;">SELLOS</h2>

        <div class="row g-3" id="sellosGrid">
            <!-- Los sellos se renderizan con JS -->
        </div>

        <div class="d-grid mt-4">
            <button class="btn rounded-pill fw-bold py-2"
                    style="border: 2px solid #0B2A4A; color: #0B2A4A; background: white;"
                    onclick="window.location.href='admin-usuarios.html'">
                Volver al Inicio
            </button>
        </div>

    </div>

    <!-- Input oculto para subir imagen -->
    <input type="file" id="inputArchivo" accept="image/*" style="display:none">

    <script>
        let sellos = [
            { id: 1, nombre: 'ACIERA', src: 'images/aciera.png', visible: true },
            { id: 2, nombre: 'FECEP',  src: 'images/fecep.png',  visible: true },
            { id: 3, nombre: 'FAIE',   src: 'images/faie.png',   visible: true },
        ];

        function renderizarSellos() {
            const grid = document.getElementById('sellosGrid');
            grid.innerHTML = '';

            sellos.forEach(sello => {
                const col = document.createElement('div');
                col.className = 'col-6';
                col.innerHTML = `
                    <div class="card border-2 rounded-3 p-2 text-center" style="border-color: #DEE2E6;">
                        <img src="${sello.src}" alt="${sello.nombre}"
                             class="img-fluid mx-auto mb-2"
                             style="height: 70px; object-fit: contain; opacity: ${sello.visible ? '1' : '0.35'};"
                             onerror="this.src='https://via.placeholder.com/120x60/F8F9FA/0B2A4A?text=${sello.nombre}'">
                        <div class="d-flex justify-content-center gap-3">
                            <button class="btn btn-sm p-0" title="${sello.visible ? 'Ocultar' : 'Mostrar'}"
                                    onclick="toggleVisible(${sello.id})">
                                <i class="bi ${sello.visible ? 'bi-eye-fill text-secondary' : 'bi-eye-slash-fill text-secondary'}"></i>
                            </button>
                            <button class="btn btn-sm p-0" title="Eliminar"
                                    onclick="eliminarSello(${sello.id})">
                                <i class="bi bi-dash-circle-fill text-danger"></i>
                            </button>
                        </div>
                    </div>
                `;
                grid.appendChild(col);
            });

            // Botón agregar
            const colAgregar = document.createElement('div');
            colAgregar.className = 'col-6';
            colAgregar.innerHTML = `
                <div class="card border-2 rounded-3 d-flex align-items-center justify-content-center"
                     style="border-color: #DEE2E6; height: 110px; cursor: pointer;"
                     onclick="document.getElementById('inputArchivo').click()">
                    <i class="bi bi-plus-circle" style="font-size: 2.5rem; color: #ADB5BD;"></i>
                </div>
            `;
            grid.appendChild(colAgregar);
        }

        function toggleVisible(id) {
            const sello = sellos.find(s => s.id === id);
            if (sello) sello.visible = !sello.visible;
            renderizarSellos();
        }

        function eliminarSello(id) {
            if (confirm('¿Eliminar este sello?')) {
                sellos = sellos.filter(s => s.id !== id);
                renderizarSellos();
            }
        }

        // Agregar nuevo sello desde archivo local
        document.getElementById('inputArchivo').addEventListener('change', function () {
            const archivo = this.files[0];
            if (!archivo) return;
            const url = URL.createObjectURL(archivo);
            const nuevoId = sellos.length ? Math.max(...sellos.map(s => s.id)) + 1 : 1;
            sellos.push({ id: nuevoId, nombre: archivo.name, src: url, visible: true });
            renderizarSellos();
            this.value = '';
        });

        renderizarSellos();
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const btnOpen  = document.getElementById('btnOpenMenu');
        const btnClose = document.getElementById('btnCloseMenu');
        const overlay  = document.getElementById('menuOverlay');
        const sideMenu = document.getElementById('sideMenu');

        btnOpen.addEventListener('click', () => {
            sideMenu.classList.add('active');
            overlay.classList.add('active');
        });

        function cerrarMenu() {
            sideMenu.classList.remove('active');
            overlay.classList.remove('active');
        }

        btnClose.addEventListener('click', cerrarMenu);
        overlay.addEventListener('click', cerrarMenu);
    </script>

    <!-- script CAMPANA  -->
    <script>
        const alertasData = [
            { nombre: 'Rocio Cappuccio', dni: '41.689.013', fecha: '19/06/2026', dias: 30 },
            { nombre: 'Lautaro Vienny',  dni: '42.896.710', fecha: '11/06/2026', dias: 22 },
            { nombre: 'Ramiro Zabala',   dni: '41.135.791', fecha: '29/05/2026', dias: 9  },
        ];

        function colorDias(dias) {
            if (dias <= 10) return 'days-red';
            if (dias <= 20) return 'days-orange';
            return 'days-green';
        }

        function renderizarAlertas() {
            const lista = document.getElementById('alertsList');
            lista.innerHTML = '';
            alertasData.forEach(a => {
                const div = document.createElement('div');
                div.className = 'alert-card';
                div.innerHTML = `
                    <div class="alert-card-name">${a.nombre}</div>
                    <div class="alert-card-dni">DNI: ${a.dni}</div>
                    <div class="alert-card-footer">
                        <span style="font-size:12px; color:#475569;">Vence el ${a.fecha}</span>
                        <span class="days-badge ${colorDias(a.dias)}">${a.dias} días</span>
                    </div>
                    <div style="display:flex; justify-content:flex-end; margin-top:8px;">
                        <button class="btn-renovar-sm">Renovar</button>
                    </div>
                `;
                lista.appendChild(div);
            });
            document.getElementById('bellBadge').textContent = alertasData.length;
        }

        const btnBell      = document.getElementById('btnBell');
        const alertsDrop   = document.getElementById('alertsDropdown');

        btnBell.addEventListener('click', (e) => {
            e.stopPropagation();
            alertsDrop.classList.toggle('active');
            cerrarMenu();
        });

        document.addEventListener('click', (e) => {
            if (!alertsDrop.contains(e.target) && e.target !== btnBell) {
                alertsDrop.classList.remove('active');
            }
        });

        renderizarAlertas();
    </script>

</body>
</html>
