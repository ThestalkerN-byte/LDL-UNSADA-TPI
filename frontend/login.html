<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login ICB</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Roboto:wght@300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container vh-100 d-flex justify-content-center align-items-center">
        <div class="login-card shadow-sm">
            <img src="images/logo.png" alt="Logo ICB" class="logo-icb" onerror="this.src='https://via.placeholder.com/180x60/FFFFFF/0B2A4A?text=ICB+DIGITAL'">
            <p class="subtitle">IGLESIA CRISTIANA BÍBLICA</p>
            <h1 class="main-title">Bienvenido</h1>
            <form id="loginForm">
                <div class="mb-3">
                     <label for="inputUserDni" class="form-label">Usuario o DNI</label>
                    <input type="text" class="form-control" id="inputUserDni" placeholder="Ingrese...">
                </div>
                <div class="mb-3">
                    <label for="inputPassword" class="form-label">Contraseña</label>
                    <input type="password" class="form-control" id="inputPassword"  placeholder="Ingrese...">
                </div>
                <div class="checkbox-container">
                    <div class="form-check">
                        <input type="checkbox" class="form-check-input" id="rememberCheck">
                        <label class="form-check-label" for="rememberCheck">Recuérdame</label>
                    </div>
                </div>  
                <div class="d-grid gap-2 col-6 mx-auto">
                    <!--id="btn-login" para simular el login. Sacar este parte al integrar con el back-->
                    <button class="btn btn-primary" id="btn-login" type="button" style="background-color: #0B2A4A; border: none; border-radius: 25px;">Ingresar</button>
                </div>
                 <div class="mt-3 text-center">
                    <a href="reestablecer-contrasena.html" class="text-decoration-none small" style="color: #0B2A4A; font-weight: bold;">¿Olvidaste tu contraseña?</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>

<script>
    document.getElementById('btn-login').addEventListener('click', function() {
        let usuario = document.getElementById('inputUserDni').value;

        if (usuario === 'admin') {
            window.location.href = 'admin-usuarios.html';
        } else {
            window.location.href = 'credencial.html';
        }
    });
</script>
