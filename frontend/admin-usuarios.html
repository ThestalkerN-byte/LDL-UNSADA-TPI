    <script>
        let usuarios = [];

            function formatearFecha(fechaISO) {
                const fecha = new Date(fechaISO);
                return fecha.toLocaleDateString('es-AR', { day: 'numeric', month: 'numeric', year: 'numeric' });
            }

            function renderizarUsuarios(filtro = '') {
                const container = document.getElementById('usersList');
                let usuariosFiltrados = usuarios;

                if (filtro.trim() !== '') {
                    const busqueda = filtro.toLowerCase();
                    usuariosFiltrados = usuarios.filter(user =>
                        user.nombre.toLowerCase().includes(busqueda) ||
                        user.apellido.toLowerCase().includes(busqueda) ||
                        user.rol.toLowerCase().includes(busqueda) ||
                        user.dni.includes(busqueda)
                    );
                }

                container.innerHTML = '';

                if (usuariosFiltrados.length === 0) {
                    container.innerHTML = '<div class="text-center text-muted mt-5">No se encontraron usuarios</div>';
                    return;
                }

                usuariosFiltrados.forEach(user => {
                    const vencida = user.estado !== 'ACTIVA';
                    const estadoColor = vencida ? 'bg-danger' : 'bg-success';
                    const fechaFormateada = formatearFecha(user.fecha_vencimiento);
                    const fechaColor = vencida ? 'text-danger' : 'text-dark';

                    const card = document.createElement('div');
                    card.className = 'card bg-white card-usuario-custom shadow-sm';
                    card.innerHTML = `
                        <div class="card-body p-3">
                            <div class="d-flex justify-content-between align-items-start mb-1">
                                <h5 class="fw-bold mb-0" style="color: #0B2A4A;">${user.nombre} ${user.apellido}</h5>
                                <span class="badge ${estadoColor} rounded-pill px-3 py-2">${user.estado}</span>
                            </div>

                            <p class="text-secondary small mb-3" style="font-size: 0.85rem;">
                                DNI: ${user.dni} | Rol: ${user.rol}<br>
                                Vence: <strong class="${fechaColor}">${fechaFormateada}</strong>
                            </p>

                            <div class="d-flex gap-2">
                                <button class="btn btn-outline-custom rounded-pill flex-grow-1 btn-sm py-2" onclick="window.location.href='editar-usuario.html?id=${user.id}'">Editar</button>
                                <button class="btn btn-outline-danger-custom rounded-pill flex-grow-1 btn-sm py-2" onclick="abrirModalEliminar(${user.id})">Eliminar</button>
                            </div>
                        </div>
                    `;
                    container.appendChild(card);
                });
            }

            // ── Traer los datos reales de la API ──
            function cargarUsuariosDesdeAPI() {
                fetch('http://localhost:8000/index.php?action=credential', {
                    credentials: 'include' // Siempre clave para el admin
                })
                    .then(r => r.json())
                    .then(respuesta => {
                        usuarios = respuesta.data;
                        // Mantenemos el texto del buscador por si acababa de buscar algo
                        const filtroActual = document.getElementById('searchInput').value;
                        renderizarUsuarios(filtroActual);
                    })
                    .catch(err => console.error('Error al cargar usuarios:', err));
            }

            // Llamada inicial cuando carga la página
            cargarUsuariosDesdeAPI();

            document.getElementById('searchInput').addEventListener('input', (e) => {
                renderizarUsuarios(e.target.value);
            });

            document.getElementById('btnNuevoUsuario').onclick = () => {
                window.location.href = 'nuevo-usuario.html';
            };
    </script>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const btnOpen  = document.getElementById('btnOpenMenu');
        const btnClose = document.getElementById('btnCloseMenu');
        const overlay  = document.getElementById('menuOverlay');
        const sideMenu = document.getElementById('sideMenu');

        btnOpen.addEventListener('click', () => {
            sideMenu.classList.add('active');
            overlay.classList.add('active');
        });

        function cerrarMenu() {
            sideMenu.classList.remove('active');
            overlay.classList.remove('active');
        }

        btnClose.addEventListener('click', cerrarMenu);
        overlay.addEventListener('click', cerrarMenu);

      // --- LÓGICA DEL MODAL DE ELIMINACIÓN ---
        let usuarioAEliminarId = null; // Variable global para recordar a quién queremos borrar

        function abrirModalEliminar(id) {
            usuarioAEliminarId = id; // Guardamos el ID del usuario seleccionado
            document.getElementById('modalEliminar').style.display = 'flex';
        }

        function cerrarModalEliminar() {
            usuarioAEliminarId = null; // Limpiamos la memoria por las dudas
            document.getElementById('modalEliminar').style.display = 'none';
        }

        async function confirmarEliminacion() {
            // Si por algún motivo no hay ID, no hacemos nada
            if (!usuarioAEliminarId) return; 

            try {
                // Hacemos la petición DELETE a la API de tus compañeros
                const response = await fetch(`http://localhost:8000/index.php?action=user&id=${usuarioAEliminarId}`, {
                    method: 'DELETE',
                    credentials: 'include'
                });

                if (response.ok || response.status === 200) {
                    // 1. Cerramos el modal
                    cerrarModalEliminar();
                    
                    // 2. Recargamos la lista automáticamente para ver el cambio
                    cargarUsuariosDesdeAPI();
                } else {
                    alert('Hubo un problema al intentar dar de baja al usuario. Revisá los permisos.');
                }

            } catch (error) {
                console.error('Error de red al eliminar:', error);
                alert('No se pudo conectar con el servidor.');
            }
        }

    </script>


    <script>
        // --- LÓGICA DE CERRAR SESIÓN DEL ADMINISTRADOR ---
        const btnCerrarSesionAdmin = document.getElementById('btnCerrarSesionAdmin');
        
        if (btnCerrarSesionAdmin) {
            btnCerrarSesionAdmin.addEventListener('click', async () => {
                try {
                    // Le pegamos al endpoint de logout para destruir la sesión real en el servidor
                    const response = await fetch('http://localhost:8000/index.php?action=logout', {
                        method: 'POST',
                        credentials: 'include' 
                    });

                    // Tanto si responde OK como si hay error, lo sacamos por seguridad
                    if (response.ok || response.status === 200) {
                        sessionStorage.removeItem('dniLogueado'); // Limpiamos la memoria
                        window.location.href = 'login.html';
                    } else {
                        console.error('El backend reportó un problema al cerrar sesión.');
                        sessionStorage.removeItem('dniLogueado');
                        window.location.href = 'login.html';
                    }

                } catch (error) {
                    console.error('Error de red al intentar cerrar sesión:', error);
                    sessionStorage.removeItem('dniLogueado');
                    window.location.href = 'login.html';
                }
            });
        }
    </script>

    <!-- script CAMPANA  -->
    <script>
    // ── CAMPANA ──
    const alertasData = [
        { nombre: 'Rocio Cappuccio', dni: '41.689.013', fecha: '19/06/2026', dias: 30 },
        { nombre: 'Lautaro Vienny',  dni: '42.896.710', fecha: '11/06/2026', dias: 22 },
        { nombre: 'Ramiro Zabala',   dni: '41.135.791', fecha: '29/05/2026', dias: 9  },
    ];

    function colorDias(dias) {
        if (dias <= 10) return 'days-red';
        if (dias <= 20) return 'days-orange';
        return 'days-green';
    }

    function renderizarAlertas() {
        const lista = document.getElementById('alertsList');
        lista.innerHTML = '';
        alertasData.forEach(a => {
            const div = document.createElement('div');
            div.className = 'alert-card';
            div.innerHTML = `
                <div class="alert-card-name">${a.nombre}</div>
                <div class="alert-card-dni">DNI: ${a.dni}</div>
                <div class="alert-card-footer">
                    <span style="font-size:12px; color:#475569;">Vence el ${a.fecha}</span>
                    <span class="days-badge ${colorDias(a.dias)}">${a.dias} días</span>
                </div>
            `;
            lista.appendChild(div);
        });
        document.getElementById('bellBadge').textContent = alertasData.length;
    }

    

    const btnBell      = document.getElementById('btnBell');
    const alertsDrop   = document.getElementById('alertsDropdown');

    btnBell.addEventListener('click', (e) => {
        e.stopPropagation();
        alertsDrop.classList.toggle('active');
        cerrarMenu();
    });

    document.addEventListener('click', (e) => {
        if (!alertsDrop.contains(e.target) && e.target !== btnBell) {
            alertsDrop.classList.remove('active');
        }
    });

    renderizarAlertas();
    </script>

    <div id="modalEliminar" class="modal-overlay">
    <div class="modal-card">
        <h4 class="modal-title">¿Eliminar Usuario?</h4>
        <p class="modal-text">Estás a punto de eliminar a este usuario del sistema. Esta acción no se puede deshacer.</p>
        <div class="modal-buttons">
            <button class="btn btn-cancelar-custom px-4 py-2" onclick="cerrarModalEliminar()">Cancelar</button>
            <button class="btn btn-danger px-4 py-2" onclick="confirmarEliminacion()">Sí, Eliminar</button>
        </div>
