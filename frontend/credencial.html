<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credencial Digital Institucional</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <button class="btn-header" id="btnCerrarSesion">Cerrar Sesión</button>
        <div class="header-right">
            <a href="mensajes-usuarios.html">
                <svg class="bell-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512">
                    <path d="M224 0c-17.7 0-32 14.3-32 32V51.2C119 66 64 130.6 64 208v118.8c0 47-17.3 92-48.4 127.6l-7.4 8.3c-8.4 9.4-10.4 22.9-5.3 34.4S19.4 512 32 512H416c12.6 0 24-7.4 29.1-18.9s3.1-25-5.3-34.4l-7.4-8.3C401.3 418.8 384 373.8 384 326.8V208c0-77.4-55-142-128-156.8V32c0-17.7-14.3-32-32-32zm45.3 493.3c12-12 18.7-28.3 18.7-45.3H224 160c0 17 6.7 33.3 18.7 45.3s28.3 18.7 45.3 18.7s33.3-6.7 45.3-18.7z"/>
                </svg>
            </a>
            <img src="images/logo.png" alt="ICB" class="header-logo" onerror="this.outerHTML='<span style=\'color:white; font-weight:bold; font-size:24px;\'>I&B</span>'">
        </div>
    </header>

    <main>
        <div class="card-container" id="credencial">
            <div class="card-flipper">
                
                <div class="card-face card-front">
                    <div class="card-top">
                        <img src="images/logo.png" alt="ICB" class="icb-logo" onerror="this.outerHTML='<strong>I&B</strong>'">
                        <img src="images/ministerio.png" alt="Ministerio" class="min-logo">
                    </div>
                    <div class="card-content-front">
                        <div class="photo-area">
                            <img src="perfil.jpg" alt="Foto" class="profile-pic" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'80\' height=\'100\'><rect width=\'80\' height=\'100\' fill=\'black\'/><circle cx=\'40\' cy=\'40\' r=\'20\' fill=\'white\'/><path d=\'M 10 100 C 10 70 70 70 70 100\' fill=\'white\'/></svg>'">
                            <div class="badge-vencida" id="cred-estado" style="display: none;">VENCIDA</div>
                        </div>
                        <div class="user-info">
                            <label>Apellido</label>
                            <p id="cred-apellido">Cargando...</p>
                            
                            <label>Nombre</label>
                            <p id="cred-nombre">Cargando...</p>
                            
                            <label>DNI</label>
                            <p id="cred-dni">Cargando...</p>
                            
                            <label>ROL</label>
                            <p id="cred-rol" style="text-transform: uppercase;">Cargando...</p>
                            
                            <label>Vencimiento</label>
                            <p id="cred-vencimiento">Cargando...</p>
                        </div>
                    </div>
                </div>

                <div class="card-face card-back">
                    <div class="card-top">
                        <img src="images/logo.png" alt="ICB" class="icb-logo" onerror="this.outerHTML='<strong>I&B</strong>'">
                        <img src="images/ministerio.png" alt="Ministerio" class="min-logo">
                    </div>
                    <div class="card-content-back">
                        <div class="contact-info">
                            <label>Dirección</label>
                            <p id="cred-direccion">-</p>
                            
                            <label>Teléfono</label>
                            <p id="cred-telefono">-</p>
                            
                            <label>Correo electrónico</label>
                            <p id="cred-email">-</p>
                        </div>
                        <div class="stamps-area" id="cred-sellos">
                            </div>
                    </div>
                </div>

            </div>
        </div>

        <button class="btn-action" id="btnFlip">Ver Reverso y Sellos</button>
    </main>

    <footer>
        <button class="btn-footer">Enviar consulta</button>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Lógica de giro de la tarjeta
            const credencial = document.getElementById('credencial');
            const btnFlip = document.getElementById('btnFlip');

            if(btnFlip && credencial) {
                btnFlip.addEventListener('click', () => {
                    credencial.classList.toggle('flipped');
                    if (credencial.classList.contains('flipped')) {
                        btnFlip.textContent = 'Volver al Frente';
                    } else {
                        btnFlip.textContent = 'Ver Reverso y Sellos';
                    }
                });
            }

            // Lógica del botón enviar consulta
            const botonVolver = document.querySelector('.btn-footer');
            if(botonVolver) {
                botonVolver.addEventListener('click', function() {
                    window.location.href = 'enviar-consulta.html';
                });
            }

            // --- CONEXIÓN CON LA API ---
            fetch('http://localhost:8000/index.php?action=credential', {
                credentials: 'include' 
            })
            .then(r => r.json())
            .then(respuesta => {
                // 1. Recuperamos el DNI guardado en el login
                const miDni = sessionStorage.getItem('dniLogueado');
                let miCredencial = null;

                // 2. Solo buscamos si la respuesta es exitosa y contiene datos
                if (respuesta.status === 'success' && respuesta.data && respuesta.data.length > 0) {
                    miCredencial = respuesta.data.find(cred => cred.dni === miDni);
                }

                // 3. SI ENCONTRAMOS LA CREDENCIAL: Dibujamos los datos reales
                if (miCredencial) {
                    document.getElementById('cred-nombre').textContent = miCredencial.nombre.toUpperCase();
                    document.getElementById('cred-apellido').textContent = miCredencial.apellido.toUpperCase();
                    document.getElementById('cred-dni').textContent = miCredencial.dni;
                    document.getElementById('cred-rol').textContent = miCredencial.rol;
                    document.getElementById('cred-direccion').innerHTML = miCredencial.direccion || "No registrada";
                    document.getElementById('cred-telefono').textContent = miCredencial.telefono || "No registrado";
                    document.getElementById('cred-email').textContent = miCredencial.email || "No registrado";
                    
                    const [anio, mes, dia] = miCredencial.fecha_vencimiento.split('-');
                    document.getElementById('cred-vencimiento').textContent = `${dia}/${mes}/${anio}`;

                    // ── CÁLCULO DINÁMICO DEL ESTADO (ACTIVA / VENCIDA) ──
                    const badgeEstado = document.getElementById('cred-estado');
                    badgeEstado.style.display = 'inline-block'; // Aseguramos que se vea
                    
                    // 1. Obtenemos la fecha de hoy y limpiamos las horas
                    const hoy = new Date();
                    hoy.setHours(0, 0, 0, 0);

                    // 2. Procesamos la fecha de vencimiento que viene de la API
                    const fechaVencimientoCard = new Date(anio, mes - 1, dia);
                    fechaVencimientoCard.setHours(0, 0, 0, 0);

                    // 3. Comparamos y forzamos el diseño exacto
                    if (fechaVencimientoCard < hoy) {
                        badgeEstado.textContent = 'VENCIDA';
                        badgeEstado.style.backgroundColor = '#ffebeb'; // Fondo rojo pastel
                        badgeEstado.style.color = '#e74c3c';           // Letra roja fuerte
                        badgeEstado.style.border = '2px solid #e74c3c';// Borde rojo fuerte
                    } else {
                        badgeEstado.textContent = 'ACTIVA';
                        badgeEstado.style.backgroundColor = '#e8f8e8'; // Fondo verde pastel
                        badgeEstado.style.color = '#28a745';           // Letra verde fuerte
                        badgeEstado.style.border = '2px solid #28a745';// Borde verde fuerte
                    }

                    // ── CARGA DE SELLOS INSTITUCIONALES (GLOBALES) ──
                  // ── CARGA DE SELLOS INSTITUCIONALES (GLOBALES) ──
                    const contenedorSellos = document.getElementById('cred-sellos');
                    
                    fetch('http://localhost:8000/index.php?action=sello', {
                        credentials: 'include'
                    })
                    .then(res => res.json())
                    .then(respuestaSellos => {
                        contenedorSellos.innerHTML = ''; // Limpiamos el contenedor

                        const listaSellos = respuestaSellos.data || respuestaSellos;

                        if (listaSellos && listaSellos.length > 0) {
                            listaSellos.forEach(sello => {
                                const img = document.createElement('img');
                                img.alt = sello.nombre;
                                img.src = sello.imagen_url;
                                img.title = sello.descripcion || sello.nombre;
                                
                                // Si la URL está rota o la imagen no existe, la ocultamos suavemente 
                                // para no arruinar la estética del reverso de la credencial.
                                img.onerror = function() { 
                                    this.style.display = 'none'; 
                                }; 
                                
                                contenedorSellos.appendChild(img);
                            });
                        }
                    })
                    .catch(err => {
                        console.error('Error de red al consultar los sellos:', err);
                        // Falla silenciosa: si se cae el servidor de sellos, 
                        // simplemente no dibujamos nada en el reverso.
                    });

                } else {
                    // 4. SI LA LISTA VINO VACÍA O NO SE ENCONTRÓ TU DNI: Mostramos el estado en trámite
                    document.getElementById('cred-nombre').textContent = "EN TRÁMITE";
                    document.getElementById('cred-apellido').textContent = "EN TRÁMITE";
                    document.getElementById('cred-dni').textContent = miDni || "No detectado";
                    document.getElementById('cred-rol').textContent = "USER";
                    document.getElementById('cred-vencimiento').textContent = "--/--/----";
                    document.getElementById('cred-direccion').innerHTML = "-";
                    document.getElementById('cred-telefono').textContent = "-";
                    document.getElementById('cred-email').textContent = "-";
                    
                    const badgeEstado = document.getElementById('cred-estado');
                    badgeEstado.textContent = "NO EMITIDA";
                    badgeEstado.style.display = 'block';
                    badgeEstado.style.backgroundColor = '#6c757d'; 
                    
                    const contenedorSellos = document.getElementById('cred-sellos');
                    contenedorSellos.innerHTML = '<p class="small text-muted text-center">Sin sellos asignados</p>';
                }
            })
            .catch(err => {
                console.error('Error al cargar la credencial:', err);
                document.getElementById('cred-nombre').textContent = "ERROR";
                document.getElementById('cred-apellido').textContent = "DE CONEXIÓN";
            });

            // --- LÓGICA DE CERRAR SESIÓN ---
            const btnCerrarSesion = document.getElementById('btnCerrarSesion');
            if (btnCerrarSesion) {
                btnCerrarSesion.addEventListener('click', async () => {
                    try {
                        // 1. Le avisamos al backend que destruya la cookie/sesión
                        const response = await fetch('http://localhost:8000/index.php?action=logout', {
                            method: 'POST',
                            credentials: 'include' // Fundamental para que el back sepa qué sesión borrar
                        });

                        // 2. Si el backend responde bien (o incluso si da error, por seguridad lo sacamos)
                        if (response.ok || response.status === 200) {
                            // Borramos el DNI de la memoria del navegador
                            sessionStorage.removeItem('dniLogueado');
                            
                            // Lo pateamos al login
                            window.location.href = 'login.html';
                        } else {
                            console.error('El backend reportó un problema al cerrar sesión.');
                            sessionStorage.removeItem('dniLogueado');
                            window.location.href = 'login.html';
                        }

                    } catch (error) {
                        console.error('Error de red al intentar cerrar sesión:', error);
                        // En caso de que se haya caído el servidor, lo sacamos igual por las dudas
                        sessionStorage.removeItem('dniLogueado');
                        window.location.href = 'login.html';
                    }
                });
            }

        }); 
    </script>
</body>
</html>
