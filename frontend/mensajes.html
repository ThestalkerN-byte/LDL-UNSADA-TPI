<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICB - Mensajes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
    <script src="js/api.js"></script>
</head>

<body style="background-color: #F8F9FA;">

    <!-- Overlay -->
    <div class="menu-overlay" id="menuOverlay"></div>

    <!-- Menú lateral -->
    <nav class="side-menu" id="sideMenu">
        <button class="side-menu-close" id="btnCloseMenu">✕</button>
        <div class="side-menu-header">
            <div class="side-menu-avatar">
                <svg viewBox="0 0 24 24"><path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z" fill="rgba(255,255,255,0.85)"/></svg>
            </div>
            <div class="side-menu-info">
                <div class="name">Cristhian Petrecca</div>
                <div class="role">Administrador</div>
            </div>
        </div>
        <div class="side-menu-nav">
            <a href="admin-usuarios.html" class="menu-item">Credenciales</a>
            <a href="mensajes.html"       class="menu-item active">Mensajes</a>
            <a href="sellos.html"         class="menu-item">Editar Sellos</a>
        </div>
        <div class="side-menu-footer">
            <button class="menu-item menu-item-danger" onclick="location.href='login.html'">Cerrar Sesión</button>
        </div>
    </nav>

    <!-- Navbar -->
    <nav class="navbar navbar-icb px-3 py-3 shadow-sm">
        <div class="container-fluid max-w-custom d-flex justify-content-between align-items-center">
            
            <div class="d-flex align-items-center gap-3">
                <!-- Hamburguesa -->
                <button class="btn-hamburger" id="btnOpenMenu" aria-label="Abrir menú">
                    <span></span><span></span><span></span>
                </button>

                <!-- Campana -->
                <div class="navbar-bell-wrapper">
                    <i class="bi bi-bell-fill text-warning" id="btnBell" style="font-size: 1.5rem; cursor: pointer;"></i>
                    <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" 
                        id="bellBadge"
                        style="font-size: 0.6rem; transform: translate(-30%, 10%) !important;">
                        3
                    </span>
                    <!-- Dropdown -->
                    <div class="alerts-dropdown" id="alertsDropdown">
                        <div class="alerts-header">Próximas a vencer</div>
                        <div class="alerts-list" id="alertsList"></div>
                    </div>
                </div>
            </div>

            <img src="images/logo.png" alt="ICB" class="header-logo" onerror="this.outerHTML='<span style=\'color:white; font-weight:bold; font-size:24px;\'>I&B</span>'">

        </div>
    </nav>

    <!-- Contenido -->
    <div class="container px-3 mt-4 max-w-custom">

        <h2 class="fw-bold text-center mb-4" style="color: #0B2A4A;">MENSAJES</h2>

        <div id="mensajesList">
            <div id="loadingMsgSpinner" style="display:flex; flex-direction:column; align-items:center; justify-content:center; padding:60px 0; gap:16px;">
                <div style="width:44px;height:44px;border:5px solid #dde;border-top-color:#0B2A4A;border-radius:50%;animation:spin3 0.8s linear infinite;"></div>
                <p style="color:#0B2A4A;font-weight:600;margin:0;">Cargando mensajes...</p>
            </div>
        </div>
        <style>@keyframes spin3{to{transform:rotate(360deg);}}</style>

    </div>

    <script>
        // Control de acceso para administradores
        const usuarioData = sessionStorage.getItem('usuario');
        if (!usuarioData) {
            window.location.href = 'login.html';
        } else {
            const usuarioObj = JSON.parse(usuarioData);
            if (usuarioObj.rol !== 'admin') {
                window.location.href = 'credencial.html';
            } else {
                // Actualizar nombre en menú lateral
                document.addEventListener('DOMContentLoaded', () => {
                    const sideMenuName = document.querySelector('.side-menu-info .name');
                    if (sideMenuName) {
                        sideMenuName.textContent = usuarioObj.nombre;
                    }
                });
            }
        }

        let mensajes = [];

        // Cargar mensajes desde el backend
        async function cargarMensajes() {
            try {
                const result = await api('../index.php?action=message');

                if (result.status === 'success') {
                    mensajes = result.data;
                    renderizarMensajes();
                    document.getElementById('loadingMsgSpinner')?.remove();
                }
            } catch (error) {
                console.error('Error al cargar mensajes:', error);
            }
        }

        function formatearFecha(fecha) {
            
            let fechaCorregida = fecha;
            if (typeof fecha === 'string' && !fecha.includes('T')) {
                fechaCorregida = fecha.replace(' ', 'T') + 'Z';
            }

            const date = new Date(fechaCorregida);
            
            return date.toLocaleString('es-AR', { 
                day: 'numeric', 
                month: 'numeric', 
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function renderizarMensajes() {
            const container = document.getElementById('mensajesList');
            container.innerHTML = '';

            if (mensajes.length === 0) {
                container.innerHTML = '<div class="text-center text-muted mt-5">No hay mensajes</div>';
                return;
            }

            // Clonamos el array original y lo invertimos para que los más nuevos queden arriba
            const mensajesInvertidos = [...mensajes].reverse();

            mensajesInvertidos.forEach(msg => {
                const card = document.createElement('div');
                card.className = 'card bg-white shadow-sm mb-3 rounded-3';
                card.style.border = '1.5px solid #DEE2E6';
                
                let answerAreaHtml = '';
                if (msg.respuesta) {
                    answerAreaHtml = `
                        <div class="rounded-3 px-3 py-2 mt-2 mb-1"
                             style="background-color: #E6F4EA; font-size: 0.9rem; color: #137333; border: 1px solid #CEEAD6;">
                            <strong>Respuesta del admin:</strong> "${msg.respuesta}"
                            <div class="text-end mt-1">
                                <small style="font-size: 0.75rem; color: #5f6368;">Respondido el: ${formatearFecha(msg.fecha_respuesta)}</small>
                            </div>
                        </div>
                    `;
                } else {
                    answerAreaHtml = `
                        <textarea class="form-control rounded-3 mb-2"
                                  rows="2"
                                  placeholder="Escribe tu respuesta..."
                                  style="font-size: 0.9rem; border-color: #DEE2E6; resize: none;"
                                  id="respuesta-${msg.id}"></textarea>

                        <div class="d-flex justify-content-end">
                            <button class="btn rounded-pill px-4 fw-bold"
                                    style="background-color: #0B2A4A; color: white; font-size: 0.85rem;"
                                    onclick="enviarRespuesta(${msg.id})">
                                Enviar Respuesta
                            </button>
                        </div>
                    `;
                }

                card.innerHTML = `
                    <div class="card-body p-3">

                        <div class="d-flex justify-content-between align-items-start mb-1">
                            <div>
                                <h6 class="fw-bold mb-0" style="color: #0B2A4A;">${msg.usuario_nombre || 'Usuario'}</h6>
                                <small class="text-muted">DNI: ${msg.usuario_dni || 'N/A'}</small>
                            </div>
                            <small class="text-muted">${formatearFecha(msg.fecha)}</small>
                        </div>

                        <div class="rounded-3 px-3 py-2 mt-2 mb-3"
                             style="background-color: #D9EAFF; font-size: 0.9rem; color: #1e293b;">
                            "${msg.contenido || ''}"
                        </div>

                        ${answerAreaHtml}

                    </div>
                `;
                container.appendChild(card);
            });
        }

        async function enviarRespuesta(id) {
            const textarea = document.getElementById(`respuesta-${id}`);
            if (textarea.value.trim() === '') {
                alert('Escribe una respuesta antes de enviar.');
                return;
            }

            try {
                const result = await api(`../index.php?action=message&id=${id}`, {
                    method: 'PUT',
                    body: JSON.stringify({
                        respuesta: textarea.value
                    })
                });

                if (result.status === 'success') {
                    
                    cargarMensajes(); 
                    
                    Swal.fire({
                        title: '¡Respuesta Enviada!',
                        text: 'El usuario ya puede ver tu respuesta.',
                        icon: 'success',
                        showConfirmButton: false,
                        timer: 3000,
                        timerProgressBar: true
                    });
                } else {
                    Swal.fire({
                        title: 'Error',
                        text: `Hubo un problema: ${result.message}`,
                        icon: 'error',
                        confirmButtonColor: '#0B2A4A'
                    });
                }
            } catch (error) {
                console.error('Error al enviar respuesta:', error);
                alert('Error al enviar respuesta.');
            }
        }

        // Cargar mensajes al iniciar
        cargarMensajes();
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const btnOpen  = document.getElementById('btnOpenMenu');
        const btnClose = document.getElementById('btnCloseMenu');
        const overlay  = document.getElementById('menuOverlay');
        const sideMenu = document.getElementById('sideMenu');

        btnOpen.addEventListener('click', () => {
            sideMenu.classList.add('active');
            overlay.classList.add('active');
        });

        function cerrarMenu() {
            sideMenu.classList.remove('active');
            overlay.classList.remove('active');
        }

        btnClose.addEventListener('click', cerrarMenu);
        overlay.addEventListener('click', cerrarMenu);
    </script>

    <script>
    // ── CAMPANA DE ALERTAS REALES ──
    function colorDias(dias) {
        if (dias <= 10) return 'days-red';
        if (dias <= 20) return 'days-orange';
        return 'days-green';
    }

    async function renderizarAlertas() {
        const lista = document.getElementById('alertsList');
        lista.innerHTML = '';
        
        try {
            const result = await api('../index.php?action=credential&sub=alerts');
            
            if (result.status === 'success') {
                const alertasData = result.data;
                document.getElementById('bellBadge').textContent = alertasData.length;
                
                if (alertasData.length === 0) {
                    lista.innerHTML = '<div class="p-3 text-center text-muted small">No hay credenciales por vencer</div>';
                    return;
                }
                
                alertasData.forEach(a => {
                    const fechaVenc = new Date(a.fecha_vencimiento);
                    const hoy = new Date();
                    const diffTime = fechaVenc - hoy;
                    const diffDays = Math.max(0, Math.ceil(diffTime / (1000 * 60 * 60 * 24)));
                    
                    const div = document.createElement('div');
                    div.className = 'alert-card';
                    div.innerHTML = `
                        <div class="alert-card-name">${a.nombre} ${a.apellido}</div>
                        <div class="alert-card-dni">DNI: ${a.dni || 'N/A'}</div>
                        <div class="alert-card-footer">
                            <span style="font-size:12px; color:#475569;">Vence el ${fechaVenc.toLocaleDateString('es-AR')}</span>
                            <span class="days-badge ${colorDias(diffDays)}">${diffDays} días</span>
                        </div>
                    `;
                    lista.appendChild(div);
                });
            }
        } catch (error) {
            console.error('Error al cargar alertas:', error);
        }
    }

    const btnBell      = document.getElementById('btnBell');
    const alertsDrop   = document.getElementById('alertsDropdown');

    btnBell.addEventListener('click', (e) => {
        e.stopPropagation();
        alertsDrop.classList.toggle('active');
        cerrarMenu();
    });

    document.addEventListener('click', (e) => {
        if (!alertsDrop.contains(e.target) && e.target !== btnBell) {
            alertsDrop.classList.remove('active');
        }
    });

    renderizarAlertas();
    </script>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</body>
</html>
