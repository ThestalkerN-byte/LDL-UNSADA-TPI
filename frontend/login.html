<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login ICB</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Roboto:wght@300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body>
    <div class="container vh-100 d-flex justify-content-center align-items-center">
        <div class="login-card shadow-sm">
            <img src="images/logo.png" alt="Logo ICB" class="logo-icb" onerror="this.src='https://via.placeholder.com/180x60/FFFFFF/0B2A4A?text=ICB+DIGITAL'">
            <p class="subtitle">IGLESIA CRISTIANA BÍBLICA</p>
            <h1 class="main-title">Bienvenido</h1>
            <form id="loginForm">
                <div class="mb-3">
                     <label for="inputUserDni" class="form-label">Usuario o DNI</label>
                    <input type="text" class="form-control" id="inputUserDni" placeholder="Ingrese...">
                </div>
                <div class="mb-3">
                    <label for="inputPassword" class="form-label">Contraseña</label>
                    <div class="input-group">
                        <input type="password" class="form-control" id="inputPassword" placeholder="Ingrese..." style="border-right: none;">
                        <button class="btn btn-outline-secondary bg-white" type="button" id="btnTogglePassword" style="border-left: none; border-color: #dee2e6;">
                            <i class="bi bi-eye-fill" id="toggleIcon" style="color: #6c757d;"></i>
                        </button>
                    </div>
                </div>
                <div class="checkbox-container">
                    <div class="form-check">
                        <input type="checkbox" class="form-check-input" id="rememberCheck">
                        <label class="form-check-label" for="rememberCheck">Recuérdame</label>
                    </div>
                </div>  
                
                <div id="mensaje-error" class="text-danger text-center small mb-3 fw-bold d-none"></div>
                
                <div class="d-grid gap-2 col-6 mx-auto">
                    <button class="btn btn-primary" id="btn-login" type="button" style="background-color: #0B2A4A; border: none; border-radius: 25px;">Ingresar</button>
                </div>
                 <div class="mt-3 text-center">
                    <a href="reestablecer-contrasena.html" class="text-decoration-none small" style="color: #0B2A4A; font-weight: bold;">¿Olvidaste tu contraseña?</a>
                </div>
            </form>
        </div>
    </div>

    <script>
        let timerError;

        document.getElementById('btn-login').addEventListener('click', async function(event) {
            event.preventDefault(); 

            const usuario = document.getElementById('inputUserDni').value;
            const password = document.getElementById('inputPassword').value;
            const divError = document.getElementById('mensaje-error');
            
            function mostrarError(mensaje) {
                divError.textContent = mensaje;
                divError.classList.remove('d-none'); 
                clearTimeout(timerError);
                timerError = setTimeout(() => {
                    divError.classList.add('d-none');
                }, 3000);
            }

            if (!usuario || !password) {
                mostrarError("Por favor, completá tu usuario y contraseña.");
                return;
            }

            const datosLogin = {
                identificador: usuario,
                password: password
            };

            try {
                const response = await fetch('http://localhost:8000/index.php?action=login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include', 
                    body: JSON.stringify(datosLogin)
                });

                if (response.status === 200) {
                    // 1. "Abrimos" el paquete de datos (JSON) que nos devolvió el backend
                    const respuestaBackend = await response.json();
                    
                    // 2. Buscamos qué rol tiene la persona que acaba de entrar.
                    // (Asumo que el backend manda el rol adentro de 'data.rol', si lo manda distinto, hay que ajustar esta línea)
                    const rolUsuario = respuestaBackend.data.rol;

                    sessionStorage.setItem('dniLogueado', usuario);

                    // 3. Hacemos el desvío automático según el rol
                    if (rolUsuario === 'admin') {
                        window.location.href = 'admin-usuarios.html';
                    } else {
                        // Si es 'user' (o cualquier otra cosa), va a su credencial
                        window.location.href = 'credencial.html';
                    }

                } else if (response.status === 401) {
                    mostrarError('Usuario o contraseña incorrectos. Por favor, intentá de nuevo.');
                } else {
                    mostrarError(`Ocurrió un error inesperado (Código: ${response.status}).`);
                }

            } catch (error) {
                console.error('Error de red:', error);
                mostrarError('No se pudo conectar con el servidor. Revisá que el backend esté encendido.');
            }
        });

        // --- Lógica para mostrar/ocultar la contraseña ---
        document.getElementById('btnTogglePassword').addEventListener('click', function() {
            const passwordInput = document.getElementById('inputPassword');
            const toggleIcon = document.getElementById('toggleIcon');

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.classList.remove('bi-eye-fill');
                toggleIcon.classList.add('bi-eye-slash-fill');
            } else {
                passwordInput.type = 'password';
                toggleIcon.classList.remove('bi-eye-slash-fill');
                toggleIcon.classList.add('bi-eye-fill');
            }
        });
    </script>
</body>
</html>
