<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login ICB</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Roboto:wght@300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="js/api.js"></script>
</head>
<body>
    <div class="container vh-100 d-flex justify-content-center align-items-center">
        <div class="login-card shadow-sm">
            <img src="images/logo.png" alt="Logo ICB" class="logo-icb" onerror="this.src='https://via.placeholder.com/180x60/FFFFFF/0B2A4A?text=ICB+DIGITAL'">
            <p class="subtitle">IGLESIA CRISTIANA BÍBLICA</p>
            <h1 class="main-title">Bienvenido</h1>
            <div id="cajaErrorLogin" class="alert alert-danger d-none py-2 text-center small mb-3" role="alert"></div>
            <form id="loginForm">
                <div class="mb-3">
                     <label for="inputUserDni" class="form-label">Usuario o DNI</label>
                    <input type="text" class="form-control" id="inputUserDni" placeholder="Ingrese...">
                </div>
                <div class="mb-3">
                    <label for="inputPassword" class="form-label">Contraseña</label>
                    <div class="input-group">
                        <input type="password" class="form-control" id="inputPassword" placeholder="Ingrese...">
                        <button class="btn btn-outline-secondary" type="button" id="btnTogglePassword" style="border-color: #dee2e6;">
                            <i class="bi bi-eye-fill" id="iconoPassword"></i>
                        </button>
                    </div>
                    <div id="capsWarning" class="text-danger mt-1 d-none" style="font-size: 0.8rem; font-weight: bold;">
                        <i class="bi bi-exclamation-triangle-fill"></i> Bloq Mayús activado
                    </div>
                </div>
                <div class="checkbox-container">
                    <div class="form-check">
                        <input type="checkbox" class="form-check-input" id="rememberCheck">
                        <label class="form-check-label" for="rememberCheck">Recuérdame</label>
                    </div>
                </div>  
                <div class="d-grid gap-2 col-6 mx-auto">
                    <!--id="btn-login" para simular el login. Sacar este parte al integrar con el back-->
                    <button class="btn btn-primary" id="btn-login" type="button" style="background-color: #0B2A4A; border: none; border-radius: 25px;">Ingresar</button>
                </div>
                 <div class="mt-3 text-center">
                    <a href="reestablecer-contrasena.html" class="text-decoration-none small" style="color: #0B2A4A; font-weight: bold;">¿Olvidaste tu contraseña?</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>

<script>


    // --- LÓGICA DEL RECUÉRDAME (Al cargar la página) ---
    document.addEventListener('DOMContentLoaded', () => {
        const savedDni = localStorage.getItem('icbDniGuardado');
        if (savedDni) {
            document.getElementById('inputUserDni').value = savedDni;
            document.getElementById('rememberCheck').checked = true; 
        }
    });

    // --- LÓGICA DEL OJITO DE LA CONTRASEÑA ---
    document.getElementById('btnTogglePassword').addEventListener('click', function() {
        const inputPwd = document.getElementById('inputPassword');
        const icon = document.getElementById('iconoPassword');
        
        if (inputPwd.type === 'password') {
            inputPwd.type = 'text';
            icon.classList.remove('bi-eye-fill');
            icon.classList.add('bi-eye-slash-fill');
        } else {
            inputPwd.type = 'password';
            icon.classList.remove('bi-eye-slash-fill');
            icon.classList.add('bi-eye-fill');
        }
    });


    // --- LÓGICA DE DETECCIÓN DE MAYÚSCULAS ---
    document.getElementById('inputPassword').addEventListener('keyup', function(event) {
        const capsWarning = document.getElementById('capsWarning');
        // getModifierState le pregunta al teclado si la luz de mayúsculas está prendida
        if (event.getModifierState('CapsLock')) {
            capsWarning.classList.remove('d-none');
        } else {
            capsWarning.classList.add('d-none');
        }
    });


    // --- LÓGICA DEL LOGIN (Sin alerts) ---
    document.getElementById('btn-login').addEventListener('click', async function() {
        const identificador = document.getElementById('inputUserDni').value;
        const password = document.getElementById('inputPassword').value;
        const cajaError = document.getElementById('cajaErrorLogin');

        // Ocultar error previo al reintentar
        cajaError.classList.add('d-none');

        if (!identificador || !password) {
            cajaError.textContent = '⚠️ Por favor complete el Usuario/DNI y la Contraseña.';
            cajaError.classList.remove('d-none');
            return;
        }

        try {
            const result = await api('../index.php?action=login', {
                method: 'POST',
                body: JSON.stringify({
                    identificador: identificador,
                    password: password
                })
            });
            console.log('Login response:', result);

            if (result && result.status === 'success') {
                sessionStorage.setItem('usuario', JSON.stringify(result.data));
                sessionStorage.setItem('jwt_token', result.data.token);

                const rememberIsChecked = document.getElementById('rememberCheck').checked;
                if (rememberIsChecked) {
                    localStorage.setItem('icbDniGuardado', identificador);
                } else {
                    localStorage.removeItem('icbDniGuardado');
                }
                
                if (result.data.rol === 'admin') {
                    window.location.href = 'admin-usuarios.html';
                } else {
                    window.location.href = 'credencial.html';
                }
            } else {
                // Reemplazo del alert de error de credenciales
                cajaError.textContent = `❌ ${result ? result.message : 'Error desconocido'}`;
                cajaError.classList.remove('d-none');
            }
        } catch (error) {
            console.error('Error al hacer login:', error);
            // Reemplazo del alert de error de red
            cajaError.textContent = '❌ Error al hacer login. Por favor intente nuevamente.';
            cajaError.classList.remove('d-none');
        }
    });
</script>
