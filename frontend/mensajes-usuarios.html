<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICB - Mis Mensajes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=2">
</head>
<body>

    <header>
        <div class="header-content">
            <button class="btn-header" onclick="window.location.href='credencial.html'">Volver al Inicio</button>
            <div class="header-right">
                <img src="images/logo.png" alt="ICB" class="header-logo" onerror="this.outerHTML='<span style=\'color:white; font-weight:bold; font-size:24px;\'>I&B</span>'">
            </div>
        </div>
    </header>

    <main class="container px-3 mt-4 pb-5" style="max-width: 800px; margin: 0 auto; flex: 1;">
        
        <h3 class="text-center fw-bold mb-4" style="color: var(--primary-color, #00154a); text-transform: uppercase;">Mensajes</h3>

        <div class="d-flex justify-content-center mb-4">
            <button class="btn btn-admin-primary rounded-pill px-5 py-2 fw-bold shadow-sm" onclick="window.location.href='enviar-consulta.html'">Nueva Consulta</button>
        </div>

        <div id="mensajesUsuarioList">
            <!-- Los mensajes se renderizan dinámicamente -->
        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
   <script>
        document.addEventListener('DOMContentLoaded', async () => {

            // Control de acceso - Redirigir si no está logueado
            const usuarioData = sessionStorage.getItem('usuario');
            if (!usuarioData) {
                window.location.href = 'login.html';
                return;
            }
            const usuario = JSON.parse(usuarioData);

            // --- FUNCIÓN PARA CORREGIR LA ZONA HORARIA (De UTC a Local) ---
            function formatearFechaUTC(fecha) {
                if (!fecha) return '';
                let fechaCorregida = fecha;
                if (typeof fecha === 'string' && !fecha.includes('T')) {
                    fechaCorregida = fecha.replace(' ', 'T') + 'Z';
                }
                return new Date(fechaCorregida).toLocaleString('es-AR', {
                    day: 'numeric',
                    month: 'numeric',
                    year: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });
            }
            // --------------------------------------------------------------

            try {
                // Cargar mensajes de este usuario
                const response = await fetch(`../index.php?action=message&id_usuario=${usuario.id}&rol=user`);
                const result = await response.json();

                if (result.status === 'success') {
                    const mensajes = result.data;

                    // --- NUEVO: Guardamos la cantidad de respuestas actuales como "leídas" ---
                    const respuestasActuales = mensajes.filter(msg => msg.respuesta && msg.respuesta.trim() !== '').length;
                    localStorage.setItem('respuestasLeidas_' + usuario.id, respuestasActuales);
                    // ------------------------------------------------------------------------

                    const container = document.getElementById('mensajesUsuarioList');
                    container.innerHTML = '';

                    if (mensajes.length === 0) {
                        container.innerHTML = '<div class="text-center text-muted mt-5">No tenés consultas enviadas.</div>';
                        return;
                    }

                    // Clonamos el array original y lo invertimos para que el más nuevo quede arriba
                    const mensajesInvertidos = [...mensajes].reverse();

                    mensajesInvertidos.forEach(msg => {
                        const card = document.createElement('div');
                        card.className = 'card bg-white shadow-sm p-4 border-0 mb-4';
                        card.style.borderRadius = '12px';
                        card.style.border = '1px solid #DEE2E6';

                        // APLICAMOS LA CORRECCIÓN AL HORARIO DEL MENSAJE
                        const dateStr = formatearFechaUTC(msg.fecha);

                        let respuestaHtml = '';
                        if (msg.respuesta) {
                            // APLICAMOS LA CORRECCIÓN AL HORARIO DE LA RESPUESTA
                            const dateRespStr = formatearFechaUTC(msg.fecha_respuesta);

                            respuestaHtml = `
                                <div class="msg-admin mt-3 pt-3 border-top">
                                    <h6 class="fw-bold mb-2" style="color: #065f46;">Respuesta del administrador:</h6>
                                    <p class="mb-0 text-dark">${msg.respuesta}</p>
                                    <div class="text-end mt-1">
                                        <small class="text-muted" style="font-size: 0.75rem;">Respondido el: ${dateRespStr}</small>
                                    </div>
                                </div>
                            `;
                        } else {
                            respuestaHtml = `
                                <div class="text-center mt-4 pt-3 border-top">
                                    <small class="text-muted fst-italic">El administrador aún no ha respondido a esta consulta.</small>
                                </div>
                            `;
                        }

                        card.innerHTML = `
                            <div class="d-flex justify-content-end mb-2">
                                <small class="text-muted">${dateStr}</small>
                            </div>
                            
                            <div class="msg-usuario">
                                <h6 class="fw-bold mb-2" style="color: #333;">Tu mensaje:</h6>
                                <p class="mb-0 text-dark">"${msg.contenido}"</p>
                            </div>

                            ${respuestaHtml}
                        `;
                        container.appendChild(card);
                    });
                }
            } catch (error) {
                console.error('Error al cargar mensajes:', error);
                const container = document.getElementById('mensajesUsuarioList');
                container.innerHTML = '<div class="text-center text-danger mt-5">Error al cargar mensajes.</div>';
            }
        });
    </script>

</body>
</html>
