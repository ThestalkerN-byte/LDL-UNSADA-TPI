<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
   
    
    <nav class="navbar navbar-icb px-3 py-3 shadow-sm">
        <div class="container-fluid max-w-custom d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center gap-3">
                
            </div>
            <img src="images/logo.png" alt="ICB" class="header-logo" onerror="this.outerHTML='<span style=\'color:white; font-weight:bold; font-size:24px;\'>I&B</span>'">
        </div>
    </nav>

    
    <div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
        
        <div class="consulta-card">
          
            <h2 class="consulta-title">ENVIAR CONSULTA</h2>
            
            
            <p class="consulta-text">
                Escribí tu consulta, duda o solicitud de actualización de datos. 
                La administración lo revisará y te responderá a la brevedad.
            </p>

            <!-- Formulario -->
            <form>
                <div class="mb-3">
                    <label for="mensajeInput" class="form-label fw-bold">Mensaje</label>
                    <textarea class="form-control custom-textarea" id="mensajeInput" rows="5" placeholder="Escribe tu consulta aquí..."></textarea>
                </div>

                <div class="d-grid gap-3 mt-4">
                    <button type="submit" class="btn-admin-primary w-100">Enviar Consulta</button>
                    <button type="button" class="btn-admin-secondary" onclick="window.location.href='credencial.html'">
                        Volver al Inicio</button>
                </div>
            </form>
        </div>

    </div>
<script>document.addEventListener('DOMContentLoaded', function() {
    const botonVolver = document.querySelector('.btn-admin-secondary.w-100');
    
    if(botonVolver) {
        botonVolver.addEventListener('click', function() {
            window.location.href = 'credencial.html';
        });
    }
});</script>
</body>
</html>
