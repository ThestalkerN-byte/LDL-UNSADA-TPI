<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credencial Digital Institucional</title>
    <link rel="stylesheet" href="style.css?v=2">
    <script src="js/api.js"></script>
</head>
<body>

    <header>
        <div class="header-content">
            <button class="btn-header" onclick="location.href='login.html'">Cerrar Sesión</button>
            <div class="header-right">
                <a href="mensajes-usuarios.html" style="position: relative; display: inline-block;">
        
                    <svg class="bell-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512">
                        <path d="M224 0c-17.7 0-32 14.3-32 32V51.2C119 66 64 130.6 64 208v118.8c0 47-17.3 92-48.4 127.6l-7.4 8.3c-8.4 9.4-10.4 22.9-5.3 34.4S19.4 512 32 512H416c12.6 0 24-7.4 29.1-18.9s3.1-25-5.3-34.4l-7.4-8.3C401.3 418.8 384 373.8 384 326.8V208c0-77.4-55-142-128-156.8V32c0-17.7-14.3-32-32-32zm45.3 493.3c12-12 18.7-28.3 18.7-45.3H224 160c0 17 6.7 33.3 18.7 45.3s28.3 18.7 45.3 18.7s33.3-6.7 45.3-18.7z"/>
                    </svg>

                    <span id="alertaMensajePunto" style="display: none; position: absolute; top: -2px; right: -2px; background-color: #dc3545; width: 11px; height: 11px; border-radius: 50%; border: 1.5px solid #0B2A4A;"></span>
                </a>
                <img src="images/logo.png" alt="ICB" class="header-logo" onerror="this.outerHTML='<span style=\'color:white; font-weight:bold; font-size:24px;\'>I&B</span>'">
            </div>
        </div>
    </header>

    <main>
        <!-- Spinner de carga -->
        <div id="loadingSpinner" style="display:flex; flex-direction:column; align-items:center; justify-content:center; padding: 60px 0; gap: 16px;">
            <div style="width:48px; height:48px; border:5px solid #dde; border-top-color:#0B2A4A; border-radius:50%; animation:spin 0.8s linear infinite;"></div>
            <p style="color:#0B2A4A; font-weight:600; margin:0;">Cargando credencial...</p>
        </div>
        <style>@keyframes spin { to { transform: rotate(360deg); } }</style>

        <div class="card-container" id="credencial" style="visibility:hidden;">
            <div class="card-flipper">
                
                <div class="card-face card-front">
                    <div class="card-top">
                        <img src="images/logo.png" alt="ICB" class="icb-logo" onerror="this.outerHTML='<strong>I&B</strong>'">
                        <img src="images/ministerio.png" alt="Ministerio" class="min-logo">
                    </div>
                    <div class="card-content-front">
                        <div class="photo-area">
                            <img src="" alt="Foto" class="profile-pic" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'80\' height=\'100\'><rect width=\'80\' height=\'100\' fill=\'black\'/><circle cx=\'40\' cy=\'40\' r=\'20\' fill=\'white\'/><path d=\'M 10 100 C 10 70 70 70 70 100\' fill=\'white\'/></svg>'">
                            <div class="badge-vencida" style="display:none;">VENCIDA</div>
                        </div>
                        <div class="user-info">
                            <label>Apellido</label>
                            <p></p>
                            
                            <label>Nombre</label>
                            <p></p>
                            
                            <label>DNI</label>
                            <p></p>
                            
                            <label>ROL</label>
                            <p></p>
                            
                            <label>Vencimiento</label>
                            <p></p>
                        </div>
                    </div>
                </div>

                <div class="card-face card-back">
                    <div class="card-top">
                        <img src="images/logo.png" alt="ICB" class="icb-logo" onerror="this.outerHTML='<strong>I&B</strong>'">
                        <img src="images/ministerio.png" alt="Ministerio" class="min-logo">
                    </div>
                    <div class="card-content-back">
                        <div class="contact-info">
                            <label>Dirección</label>
                            <p></p>
                            
                            <label>Teléfono</label>
                            <p></p>
                            
                            <label>Correo electrónico</label>
                            <p></p>
                        </div>
                        <div class="stamps-area"></div>
                    </div>
                </div>

            </div>
        </div>

        <button class="btn-action" id="btnFlip" style="display:none;">Ver Reverso y Sellos</button>
    </main>

    <footer>
        <div class="footer-content">
            <button class="btn-footer">Enviar consulta</button>
        </div>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            // Cargar datos del usuario desde sessionStorage
            const usuarioData = sessionStorage.getItem('usuario');
            if (!usuarioData) {
                window.location.href = 'login.html';
                return;
            }

            const usuario = JSON.parse(usuarioData);

            const spinner   = document.getElementById('loadingSpinner');
            const cardEl    = document.getElementById('credencial');
            const btnFlipEl = document.getElementById('btnFlip');

            try {
                const result = await api(`../index.php?action=credential&id_usuario=${usuario.id}`);

                if (result.status === 'success') {
                    const credencial = result.data[0] ?? null;
                    if (credencial) { credencial.id_usuario = credencial.id_usuario ?? usuario.id; }
                    
                    if (credencial) {
                        // Actualizar foto de perfil si existe
                        document.querySelector('.profile-pic').src = usuario.foto_perfil || '';

                        // Actualizar datos de la credencial
                        document.querySelector('.user-info p:nth-child(2)').textContent = usuario.apellido?.toUpperCase() || '';
                        document.querySelector('.user-info p:nth-child(4)').textContent = usuario.nombre?.toUpperCase() || '';
                        document.querySelector('.user-info p:nth-child(6)').textContent = usuario.dni || '';
                        document.querySelector('.user-info p:nth-child(8)').textContent = usuario.rol?.toUpperCase() || '';
                        
                        // Fix timezone shift: parse string directly to avoid GMT offsets
                        const parts = credencial.fecha_vencimiento.split('T')[0].split('-');
                        document.querySelector('.user-info p:nth-child(10)').textContent = `${parts[2]}/${parts[1]}/${parts[0]}`;

                        // Actualizar reverso
                        document.querySelector('.contact-info p:nth-child(2)').innerHTML = (usuario.direccion || 'No especificada').replace(',', '<br>');
                        document.querySelector('.contact-info p:nth-child(4)').textContent = usuario.telefono || 'No especificado';
                        document.querySelector('.contact-info p:nth-child(6)').textContent = usuario.email || '';

                        // Actualizar sellos
                        const stampsArea = document.querySelector('.stamps-area');
                        stampsArea.innerHTML = '';
                        
                        if (credencial.sellos && credencial.sellos.length > 0) {
                            credencial.sellos.forEach(sello => {
                                const img = document.createElement('img');
                                img.src = sello.src || '';
                                img.alt = sello.nombre || '';
                                stampsArea.appendChild(img);
                            });
                        } else {
                            stampsArea.innerHTML = '<p style="font-size: 12px; color: #666;">Sin sellos asignados</p>';
                        }

                        // Verificar si está vencida
                        const hoy = new Date();
                        hoy.setHours(0, 0, 0, 0);
                        const fechaVencimiento = new Date(credencial.fecha_vencimiento);
                        fechaVencimiento.setHours(0, 0, 0, 0);
                        
                        const badgeVencida = document.querySelector('.badge-vencida');
                        if (fechaVencimiento < hoy) {
                            badgeVencida.style.display = 'block';
                        } else {
                            badgeVencida.style.display = 'none';
                        }
                    } else {
                        // No se encontró credencial para este usuario
                        document.querySelector('.user-info p:nth-child(2)').textContent = usuario.apellido?.toUpperCase() || '';
                        document.querySelector('.user-info p:nth-child(4)').textContent = usuario.nombre?.toUpperCase() || '';
                        document.querySelector('.user-info p:nth-child(6)').textContent = usuario.dni || '';
                        document.querySelector('.user-info p:nth-child(8)').textContent = usuario.rol?.toUpperCase() || '';
                        document.querySelector('.user-info p:nth-child(10)').textContent = 'Sin credencial';
                        document.querySelector('.stamps-area').innerHTML = '<p style="font-size: 12px; color: #666;">Sin sellos asignados</p>';
                    }
                }
            } catch (error) {
                console.error('Error al cargar credencial:', error);
            } finally {
                // Ocultar spinner y mostrar la credencial real (sin importar si hubo error)
                spinner.style.display = 'none';
                cardEl.style.visibility = 'visible';
                btnFlipEl.style.display = '';
            }


            // Verificar si hay respuestas nuevas del administrador
                try {
                    const resultadoMensajes = await api(`../index.php?action=message&id_usuario=${usuario.id}&rol=user`);
                    
                    if (resultadoMensajes.status === 'success') {
                        // Contamos cuántos mensajes del usuario ya tienen una respuesta del admin
                        const totalRespuestas = resultadoMensajes.data.filter(msg => msg.respuesta && msg.respuesta.trim() !== '').length;
                        
                        // Traemos la cantidad de respuestas que el usuario ya leyó la última vez
                        const respuestasVistas = parseInt(localStorage.getItem('respuestasLeidas_' + usuario.id)) || 0;
                        
                        // Si hay más respuestas que las que vio antes, encendemos el puntito
                        if (totalRespuestas > respuestasVistas) {
                            document.getElementById('alertaMensajePunto').style.display = 'block';
                        }
                    }
                } catch (error) {
                    console.error('Error al verificar mensajes nuevos:', error);
                }

            // Funcionalidad de flip
            const credencial = document.getElementById('credencial');
            const btnFlip = document.getElementById('btnFlip');

            if(btnFlip && credencial) {
                btnFlip.addEventListener('click', () => {
                    credencial.classList.toggle('flipped');
                    
                    if (credencial.classList.contains('flipped')) {
                        btnFlip.textContent = 'Volver al Frente';
                    } else {
                        btnFlip.textContent = 'Ver Reverso y Sellos';
                    }
                });
            }
        });
    </script>
    <script>document.addEventListener('DOMContentLoaded', function() {
    const botonVolver = document.querySelector('.btn-footer');
    
    if(botonVolver) {
        botonVolver.addEventListener('click', function() {
            window.location.href = 'enviar-consulta.html';
        });
    }
});</script>
</body>
</html>
