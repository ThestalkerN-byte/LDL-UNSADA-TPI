services:
  - type: web
    name: ldl-unsada-tpi
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free                   # Plan gratuito de Render
    region: oregon               # us-west-2 (más cercana)
    branch: main                 # rama principal del repositorio
    healthCheckPath: /index.php  # Render verifica que el servicio responde

    # Variables de entorno en Render:
    # ⚠ IMPORTANTE: Configurar estas variables en el dashboard de Render
    # con los valores reales de tu base de datos externa
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: DB_DRIVER
        value: pdo_mysql
      - key: DB_HOST
        value: "TU_DB_HOST_RENDER"     # ⚠ Configurar en dashboard de Render
      - key: DB_PORT
        value: "3306"
      - key: DB_NAME
        value: "TU_DB_NAME_RENDER"     # ⚠ Configurar en dashboard de Render
      - key: DB_USER
        value: "TU_DB_USER_RENDER"     # ⚠ Configurar en dashboard de Render
      - key: DB_PASS
        value: "TU_DB_PASS_RENDER"     # ⚠ Configurar en dashboard de Render
      - key: DB_CHARSET
        value: utf8mb4
      - key: DB_SSL
        value: REQUIRED
      - key: JWT_SECRET
        value: "TU_JWT_SECRET_RENDER"  # ⚠ Configurar en dashboard de Render
      - key: JWT_EXPIRY
        value: "3600"
      - key: CORS_ORIGIN
        value: "*"
      - key: MAIL_ENABLED
        value: "false"           # Cambiar a "true" cuando se configure SMTP
